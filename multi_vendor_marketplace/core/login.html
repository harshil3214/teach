<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif;
            background-color: #e5e7eb;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%);
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 350px; color: white; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        input {
            width: 100%; padding: 12px; margin: 10px 0;
            border-radius: 8px; border: none; outline: none;
        }
        button {
            width: 100%; padding: 12px; background: #6366f1;
            color: white; border: none; border-radius: 50px;
            font-weight: 600; cursor: pointer; margin-top: 20px;
        }
        a { color: #a5b4fc; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Welcome Back</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p><a href="{% url 'signup' %}">Don't have an account? Sign up</a></p>
    </div>
</body>
</html>

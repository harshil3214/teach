<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Aura Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; }
        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; background-color: #e5e7eb;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 40px; border-radius: 28px;
            width: 100%; max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            color: #000;
        }
        h2 { margin-top: 0; font-weight: 600; }
        .item-summary { background: #f3f4f6; padding: 15px; border-radius: 15px; margin-bottom: 20px; border-left: 5px solid var(--primary); }
        label { display: block; margin-top: 15px; font-size: 0.85rem; font-weight: 600; }
        input {
            width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px;
            border: 1px solid #ddd; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: var(--primary); }
        .btn-confirm {
            width: 100%; padding: 15px; background: var(--primary);
            color: white; border: none; border-radius: 50px;
            font-weight: 600; margin-top: 25px; cursor: pointer; transition: 0.3s;
        }
        .btn-confirm:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body>
    <div class="glass-card">
        <h2>Complete Purchase</h2>
        <div class="item-summary">
            <p style="margin: 0;">Buying: <b>{{ product.name }}</b></p>
            <p style="margin: 5px 0 0 0;">Price: <b>${{ product.price }}</b></p>
        </div>

        <form method="post">
            {% csrf_token %}
            <label>Full Name</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" name="first_name" placeholder="First" required>
                <input type="text" name="last_name" placeholder="Last" required>
            </div>
            
            <label>Shipping Address</label>
            <input type="text" name="address" placeholder="Street Address" required>
            
            <div style="display: flex; gap: 10px;">
                <div style="flex: 2;">
                    <label>City</label>
                    <input type="text" name="city" required>
                </div>
                <div style="flex: 1;">
                    <label>Zipcode</label>
                    <input type="text" name="zipcode" required>
                </div>
            </div>

            <button type="submit" class="btn-confirm">Confirm & Pay</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --glass-bg: rgba(255, 255, 255, 0.85); /* Whiter glass for black text contrast */
        }

        body { 
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            padding: 45px;
            border-radius: 28px;
            width: 350px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
            color: #000000; /* Force black text */
        }

        h2 { margin-bottom: 25px; font-weight: 600; color: #000; }

        form p { text-align: left; color: #000; }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.2);
            background: white;
            color: black;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        button:hover { opacity: 0.9; transform: scale(1.02); }

        a { color: var(--primary-color); text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Welcome Back</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Log In</button>
        </form>
        <p style="margin-top: 20px;">
            <a href="{% url 'signup' %}">Need an account? <b>Sign Up</b></a>
        </p>
    </div>
</body>
</html>

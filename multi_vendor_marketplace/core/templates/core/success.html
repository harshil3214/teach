<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success | Aura Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; text-align: center; 
            background: #e5e7eb; padding-top: 100px; color: #000;
        }
        .success-box {
            background: white; display: inline-block; padding: 50px;
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .icon { font-size: 50px; margin-bottom: 20px; }
        .btn-home {
            display: inline-block; margin-top: 20px; padding: 12px 30px;
            background: #6366f1; color: white; text-decoration: none;
            border-radius: 50px; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="success-box">
        <div class="icon">✅</div>
        <h1>Order Placed!</h1>
        <p>Thank you for your purchase. The admin has received your order.</p>
        <a href="{% url 'frontpage' %}" class="btn-home">Back to Marketplace</a>
    </div>
</body>
</html>
